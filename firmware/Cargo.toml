[package]
name = "fsei-xmas-card-25"
version = "0.1.0"
authors = ["Lukas Fink <lukas.fink1@gmail.com>"]
edition = "2024"
license = "MIT OR Apache-2.0"

[[bin]]
name = "fsei-xmas-card-25"
harness = false # do not use the built in cargo test harness -> resolve rust-analyzer errors

[dependencies]
ch32-hal = { git = "https://github.com/ch32-rs/ch32-hal.git", default-features = false, features = [
    "ch32v003f4u6",
    "rt",
    "memory-x",
] }
embassy-executor = { version = "0.9.1", features = [
    "arch-spin",
    "executor-thread"
] }
embassy-futures = "0.1.2"
embassy-sync = "0.7.2"
embassy-time = { version = "0.5.0" }
embassy-time-queue-utils = "0.3.0"
embassy-time-driver = { version = "0.2.1", features = [ "tick-hz-10_000" ] }
critical-section = "1.2.0"
qingke-rt = "0.6.1"
qingke = { version = "0.6.1", features = [ "critical-section-impl" ] }
embedded-hal = "1.0.0"
panic-halt = "1.0.0"

[profile.dev]
opt-level = 's'

[profile.release]
strip = false     # symbols are not flashed to the microcontroller, so don't strip them.
codegen-units = 1 # LLVM can perform better optimizations using a single thread
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 'z'
overflow-checks = false
